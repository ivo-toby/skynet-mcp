[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    contract: marks tests as contract tests
    unit: marks tests as unit tests

addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
